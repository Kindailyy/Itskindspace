
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Appreciation to You</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600&display=swap');


:root {
  --cream: #faf7f0;
  --paper: #fffdf8;
  --gold: #b18a4a;
  --ink: #39382f;
  --muted: #777365;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 16px;
  background: var(--cream);
  color: var(--ink);
  font-family: 'DM Sans', 'Noto Sans Myanmar', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app {
  width: 100%;
  max-width: 460px;
}

.top {
  text-align: center;
  margin-bottom: 24px;
}

.eyebrow {
  color: var(--gold);
  letter-spacing: 3px;
  font-size: 10px;
  font-weight: 700;
}

.top h1 {
  font-size: 25px;
  font-weight: 500;
  margin: 12px 0 8px;
}

.top p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
  margin: 0;
}

.selector {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--muted);
}

select {
  width: 100%;
  padding: 13px;
  border: 1px solid #e7decd;
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  outline-color: var(--gold);
}

.card {
  position: relative;
  overflow: visible;
  height: auto;
  width: 100%;
  background: var(--paper);
  border: 1px solid #e8ddc9;
  border-radius: 5px;
  padding: 34px 26px 28px;
  text-align: center;
  box-shadow: 0 14px 40px #54452a0c;
}

.card::before {
  content: "";
  position: absolute;
  top: 9px;
  left: 9px;
  right: 9px;
  bottom: 9px;
  border: 1px solid #eee5d5;
  pointer-events: none;
}

.heart {
  font-size: 26px;
  color: var(--gold);
  margin-bottom: 14px;
}

.card-label {
  font-size: 10px;
  letter-spacing: 2.5px;
  color: var(--gold);
  font-weight: 700;
}

.card h2 {
  font-size: 25px;
  line-height: 1.5;
  font-weight: 500;
  margin: 14px 0 5px;
  overflow-wrap: anywhere;
}

.rule {
  width: 42px;
  height: 1px;
  background: var(--gold);
  margin: 22px auto;
}

.message {
  font-family: 'Noto Sans Myanmar', sans-serif;
  font-size: 13px;
  line-height: 2.15;
  color: #625f53;
  white-space: pre-line;
  overflow-wrap: break-word;
  word-break: break-word;
}

.quote {
  margin-top: 22px;
  font-family: 'Noto Sans Myanmar', sans-serif;
  font-size: 12px;
  line-height: 1.9;
  color: var(--ink);
}

.signature {
  margin-top: 28px;
  font-size: 11px;
  line-height: 2;
  color: var(--muted);
}

.signature strong {
  display: block;
  color: var(--gold);
  letter-spacing: 1px;
  font-size: 12px;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

button {
  flex: 1;
  border: 1px solid var(--gold);
  background: transparent;
  color: var(--ink);
  padding: 12px 8px;
  border-radius: 8px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

button.primary {
  background: var(--gold);
  color: white;
}

button:active {
  transform: scale(.98);
}

.footer {
  text-align: center;
  color: #999181;
  font-size: 10px;
  margin-top: 22px;
  letter-spacing: 1px;
}

@media print {
  body { background: white; padding: 0; }
  .top, .selector, .actions, .footer { display: none; }
  .app { max-width: 100%; }
  .card { box-shadow: none; }
}


#employeeName {
  width: 100%;
  padding: 14px;
  border: 1px solid #e7decd;
  border-radius: 8px;
  background: #fffdf8;
  color: #39382f;
  font: inherit;
  font-size: 14px;
  margin-bottom: 10px;
}

#nameForm button {
  display: block;
  width: fit-content;
  margin: 10px auto 0;
  padding: 12px 24px;
}

#status {
  font-size: 12px;
  line-height: 1.8;
  text-align: center;
  color: #9a654e;
}

.card {
  display: none;
}

.card.show {
  display: block;
}

</style>
</head>

<main class="app">

 <input

  <div class="footer">MADE WITH GRATITUDE · ONE TEAM, MANY HEARTS</div>

</main>

                  ဘယ်အရာမဆို အစဆိုတာ ရှိစမြဲပါပဲ၊ ခေါင်းဆောင်ကောင်းတစ်ယောက် ဖြစ်လာဖို့၊စီနီယာကောင်း တစ်ယောက် ဖြစ်လာဖို့ဆိုတာ နောက်လိုက်ကောင်း ဖြစ်လာတာကနေ စတင်ရတယ်၊ တခြားလူတွေကို ဦးဆောင်မှု မပြုခင်၊ လူတွေက ပထမဆုံး ခေါင်းဆောင်တစ်ယောက်ရဲ့ စကားကို နားထောင်ရတယ် ၊လိုက်နာရတယ်၊ ဘာကြောင့် ဒီလိုလုပ်ရတယ်ဆိုတဲ့အကြောင်းအရာကို နားလည်နိုင်ရတယ်၊ နောက်ဆုံးအနေနဲ့ ကိုယ့်ရဲ့ ပတ်ဝန်းကျင်မှာ ရှိတဲ့ လူတွေကို လေးစားမှုရှိရတယ်။
                   ကောင်းမွန်တဲ့နောက်လိုက်ကောင်းအနေနဲ့ Leader တွေရဲ့ လမ်းညွှန်မှုတွေကို နာခံရတယ်၊ညွှန်ကြားချက်တွေကို လိုက်နာရတယ်၊ ကိုယ့် အဖွဲ့အစည်းရဲ့ အစိတ်အပိုင်းတစ်ခုအနေနဲ့ အမြဲပါဝင်ဆောင်ရွက်နေရတယ်၊ တာဝန်ယူမှု တာဝန်ခံမှူရှိရတယ်၊ နောက်ဆုံးအနေနဲ့ အမှားတွေကနေ သင်ယူကြရတယ်။ ဒီအချက်တွေကြောင့် ကိုယ့်ကို အသိပညာဗဟုသုတ တိုးပွါးစေနိုင်တယ် ၊စိတ်ရှည်သည်းခံမှုရှိလာမယ်၊ စည်းကမ်းရှိလာမယ်၊ အရေးကြီးဆုံးအနေနဲ့ကတော့ ခေါင်းဆောင်ကောင်းတစ်ယောက် ဖြစ်ဖို့ ကိုယ်တိုင် အလုပ်လုပ်တက်ရုံ၊အမိန့်ပေးတက်ရုံနဲ့ မလုံလောက်ပါဘူး။ ကိုယ်ဦးဆောင်ရမယ့်သူတွေရဲ့ အခက်အခဲ၊ခံစားချက်၊အမြင်နဲ့ လုပ်ငန်းခွင် အခြေအနေတွေကိုလည်း နားလည်ပေးနိုင်ဖို့ လိုပါတယ်။
ကိုယ်အမြဲ သိတိရနေရမှာက- 
သူများကို မသင်ပေးခင် ကိုယ်က အရင် လေ့လာရတယ်၊
သူများကို မပြောခင် ကိုယ်က အရင် နားထောင်တက်ရမယ်၊
ဝေဖန်မှု မလုပ်ခင် ကိုယ်က အရင် နားလည်မှုပေးရမယ်၊
သူတစ်ပါးဆီက တာဝန်ယူမှုကို မမျော်လင့်ခင် ကိုယ်တိုင်အရင် တာဝန်ယူတက်ပါစေ၊
တခြားသူတွေရဲ့ လေးစားမှုကို မမျော်လင့်ခင် ကိုယ်က တခြားလူတွေကို အရင်လေးစားမှု ပေးတက်ပါစေ။
 ခေါင်းဆောင်ကောင်းတစ်ယောက်ဆိုတာ ကိုယ်က အထက်လူကြီးဖြစ်လို့ အမိန့်ပေးနိုင်သူ တစ်ယောက်လို့ မဆိုလိုပါဘူး။ကိုယ့်အဖွဲ့သားတွေနဲ့အတူ လက်တွဲလုပ်ဆောင်နိုင်သူ၊ သူတို့ရဲ့ အားသာချက် အားနည်းချက်တွေကို နားလည်ပေးနိုင်သူ၊တစ်ယောက်ချင်းစီ ပိုမို တိုးတက်လာအောင် လမ်းညွှန်ပေးနိုင်သူ ဖြစ်ရပါမယ်။

ဒါက ညီမလေးအနေနဲ့ ဘယ် department ကိုပဲ သွားသွား ကိုယ်က စီနီယာတစ်ယောက်အနေနဲ့ ခေါင်းဆောင်ရမဲ့ အပိုင်းတွေမှာ အဆင်ပြေချောမွေ့စေဖို့ ရည်ရွယ်တဲ့ စာလေးပါ

ကိုယ်နဲ့အတူ ဒီခရီးလမ်းမှာ လက်တွဲခဲ့ပေးတဲ့အတွက် ကျေးဇူးတင်ပါတယ်။ ဒီနေ့ထက် မနက်ဖြန်မှာ ပိုကောင်းတဲ့သူတစ်ယောက် ဖြစ်လာပါစေ။ တစ်နေ့မှာ ကိုယ်တိုင်လည်း ခေါင်းဆောင်ကောင်းတစ်ယောက် ဖြစ်လာပြီး ကိုယ့်နောက်ကလူတွေကို လက်တွဲခေါ်ယူနိုင်သူ ဖြစ်လာပါစေလို့ ဆုတောင်းပေးပါတယ်။

const nameInput = document.getElementById("employeeName");
const nameForm = document.getElementById("Name");
const nameEl = document.getElementById("name");
const messageEl = document.getElementById("message");
const quoteEl = document.getElementById("quote");
const statusEl = document.getElementById("status");
const cardEl = document.querySelector(".card");
  const titleEl = document.getElementById("cardTitle");

document.getElementById("year").textContent =
  new Date().getFullYear();

nameForm.addEventListener("submit", function (event) {
  event.preventDefault();

  const enteredName = nameInput.value.trim().toLowerCase();

  // Find only the card matching the entered name.
  const person = people.find(
    p => p.name.trim().toLowerCase() === enteredName
  );

  if (!person) {
    cardEl.classList.remove("show");
    statusEl.textContent =
      "Sorry, we couldn't find your card. Please check your name and try again.";
    return;
  }
titleEl.textContent = person.title;
  nameEl.textContent = person.name;
  messageEl.textContent = person.message;
  quoteEl.textContent = person.quote;

  statusEl.textContent = "";
  cardEl.classList.add("show");
});
