<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animated Birthday Gift</title>
<style>
:root{--bg:#fbe3dc;--ink:#2b1b1b;--red:#ee5a5a;--pink:#f48fb1;--card:#fff;--grid:rgba(238,90,90,.12);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a2327;--ink:#fff;--card:#4a2d32;--grid:rgba(255,255,255,.07)}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;position:relative;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
/* bunting */
.bunting{position:absolute;top:0;left:0;right:0;height:60px;display:flex;justify-content:space-around}
.bunting i{width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid var(--red);
transform-origin:top;animation:sway 2.4s ease-in-out infinite alternate}
.bunting i:nth-child(even){border-top-color:var(--pink);animation-delay:-1.2s}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
/* title */
.title{position:absolute;top:18%;left:0;right:0;text-align:center;line-height:.95}
.title span{display:block;font-weight:900;font-size:clamp(46px,16vw,96px);color:#fff;-webkit-text-stroke:3px var(--ink);
paint-order:stroke fill;text-shadow:5px 5px 0 var(--red);opacity:0;transform:translateY(-30px) scale(.8);animation:pop .7s cubic-bezier(.3,1.6,.5,1) forwards}
.title span+span{animation-delay:.35s;color:var(--red);text-shadow:5px 5px 0 var(--ink)}
@keyframes pop{to{opacity:1;transform:none}}
/* bear */
.stage{position:absolute;bottom:14%;left:50%;width:220px;height:220px;margin-left:-110px;border:3px dashed var(--ink);border-radius:50%;
display:grid;place-items:center;font-size:120px;opacity:0;transform:scale(0);animation:pop .8s 1.1s cubic-bezier(.3,1.6,.5,1) forwards}
.bear{animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-8px) rotate(-5deg)}to{transform:translateY(8px) rotate(5deg)}}
.balloon{position:absolute;font-size:56px;bottom:-80px;animation:rise 7s linear infinite}
@keyframes rise{to{transform:translateY(-120vh)}}
/* button */
button{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);font:900 18px inherit;font-family:inherit;padding:12px 28px;
border:3px solid var(--ink);border-radius:999px;background:var(--red);color:#fff;box-shadow:4px 4px 0 var(--ink);cursor:pointer;
opacity:0;animation:pop .6s 1.8s forwards, pulse 1.4s 2.4s infinite}
button:active{box-shadow:1px 1px 0 var(--ink);margin:3px 0 0 3px}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.07)}}
/* confetti */
.dot{position:absolute;top:-12px;border-radius:50%;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:5}
.overlay.on{display:grid}
.card{background:var(--card);border-radius:20px;padding:28px 24px;width:min(80%,320px);text-align:center;border:3px solid var(--ink);
animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards;opacity:0}
.card h2{margin:0 0 8px;color:var(--red)}
.card p{margin:0 0 16px;line-height:1.5}
.card b{display:block;font-size:64px}
.card button{position:static;transform:none;animation:none;opacity:1;font-size:15px;padding:8px 20px}
</style>
</head>
<body>
<div class="bunting" id="bunting"></div>
<div class="title"><span>Happy</span><span>Birthday</span></div>
<div class="stage"><div class="bear">🧸</div></div>
<button id="open">Open your gift 🎁</button>

<div class="overlay" id="ov">
  <div class="card">
    <b>🎂</b>
    <h2>To you!</h2>
    <p>Wishing you a day full of joy, cake and surprises. Edit this message in the HTML!</p>
    <button id="close">Close</button>
  </div>
</div>

<script>
// bunting flags
var b=document.getElementById('bunting');
for(var i=0;i<9;i++){b.appendChild(document.createElement('i'));}

// confetti
var colors=['#ee5a5a','#f48fb1','#ffd166','#8ecae6','#b5e48c'];
function confetti(){
  var d=document.createElement('div');d.className='dot';
  var s=6+Math.random()*8;
  d.style.cssText='left:'+Math.random()*100+'vw;width:'+s+'px;height:'+s+'px;background:'+colors[Math.random()*5|0]+
    ';animation-duration:'+(3+Math.random()*3)+'s';
  document.body.appendChild(d);
  setTimeout(function(){d.remove()},6500);
}
setInterval(confetti,120);

// balloons
['🎈','🎈','🎈'].forEach(function(e,i){
  var el=document.createElement('div');el.className='balloon';el.textContent=e;
  el.style.left=(15+i*30)+'%';el.style.animationDelay=(i*2.3)+'s';
  document.body.appendChild(el);
});

// gift card
var ov=document.getElementById('ov');
document.getElementById('open').onclick=function(){ov.classList.add('on');for(var i=0;i<60;i++)confetti();};
document.getElementById('close').onclick=function(){ov.classList.remove('on');};
</script>
</body>
</html>
